name: Build Android APK

on:
  workflow_dispatch: 
  push:
    branches:
      - main 
      - master # Triggers on master as well, just in case

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    # This tells GitHub to run all commands inside your app folder
    defaults:
      run:
        working-directory: ./SIA-Offline 

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: SIA-Offline/package-lock.json

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Project Dependencies
        run: npm install

      - name: 🛠️ Generate Native Android Project
        run: npx expo prebuild --platform android

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Offline-APK
          # Points to the generated APK inside the subfolder
          path: SIA-Offline/android/app/build/outputs/apk/debug/app-debug.apk